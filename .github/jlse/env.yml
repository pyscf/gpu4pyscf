# Conda environment for .github/workflows/sycl-jlse-ci.yml (JLSE, Intel PVC).
# Released dpnp 0.20.0 + dpctl 0.22.1 from Intel's channel: the dppy/label/dev
# nightlies currently cannot be solved (they need mkl>=2026.2 builds that are
# not published), and mixing nightly dpctl with released dpnp breaks at import.
# Same toolchain as sycl-cpu-ci-env.yml, minus the OpenCL CPU runtime.
# intel-compute-runtime supplies ocloc (AOT) and the level-zero loader comes
# from `level-zero`; the level-zero GPU driver itself is taken from the node
# (see ZE_DRIVER_DIR in run_sycl_ci.sh). No environment modules are used.
# Built once on the login node (which has network access) into a shared
# prefix; compute nodes only read it.
name: sycl-jlse
channels:
  - https://software.repos.intel.com/python/conda
  - conda-forge
dependencies:
  - python=3.12
  - dpnp
  - dpctl
  - dpcpp_linux-64=2026.2.0
  - ifx_linux-64=2026.2.0
  - mkl-devel-dpcpp=2026.2.0
  - tbb-devel
  - intel-compute-runtime
  - intel-graphics-compiler
  - level-zero
  - cmake
  - ninja
  - ccache
  - numpy
  - scipy
  - h5py
  - pytest
  - pytest-timeout
  - pip
  - pip:
      - pyscf==2.14.0
      - basis-set-exchange==0.11
      - pyscf-dispersion==1.5.0
      - geometric==1.1.0
      - packaging~=24.0
      - MCFun
      - pytest-xdist
      - pytest-cov
