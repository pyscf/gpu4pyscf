# Conda environment for .gitlab-ci.yml (JLSE chiatta, Intel PVC) — MODULES MODE
# (default, USE_MODULES=1): conda installs ONLY the nightly dpnp/dpctl the SYCL port
# needs (dpnp nightly from dppy/label/dev, which also provides dpctl 0.24.0dev0 and
# requires Python >= 3.13; dpctl >= 0.23 is needed for dpctl.compiler), plus python,
# pip and the test dependencies. The whole toolchain (icx/icpx/ifx, MKL, TBB, cmake,
# level-zero loader, IGC/ocloc) comes from the node's system modules loaded in
# ci_sycl.sh (SYCL_MODULES, default "intel/oneapi/release/2026.2.0 compiler mkl
# cmake"); the GPU driver (libze_intel_gpu) comes from the node via ZE_DRIVER_DIR.
# Nightly dpnp needs mkl/intel-sycl-rt >= 2026.2, which only Intel's conda channel
# has — hence that channel below, and the mkl/intel-sycl-rt pins: $ENV_PREFIX/lib
# goes first on LD_LIBRARY_PATH, so its runtime libs must match the module toolchain
# (2026.2.0); unpinned, the solver would pick mkl 2026.2.1.
# Test deps match the CUDA CI (unittest.yml + dockerfiles/ubuntu_devel):
# requirements.txt minus CUDA-only packages, plus MCFun, pytest-xdist, pytest-cov,
# pytest-benchmark. Fallback with the full toolchain in conda: env-conda.yml
# (USE_MODULES=0). Re-solved per pipeline into $CI_ROOT/envs; test jobs reuse it.
name: sycl-jlse
channels:
  - dppy/label/dev
  - https://software.repos.intel.com/python/conda
  - conda-forge
dependencies:
  - python=3.13
  - dppy/label/dev::dpnp>=0.21.0dev0
  - dpctl>=0.23.0
  - mkl=2026.2.0
  - intel-sycl-rt=2026.2.0
  - pip
  - ninja
  - ccache
  - patchelf
  - numpy
  - scipy
  - h5py
  - pytest
  - pytest-benchmark
  - pip:
      - pyscf==2.14.0
      - basis-set-exchange==0.11
      - pyscf-dispersion==1.5.0
      - geometric==1.1.0
      - packaging~=24.0
      - MCFun
      - pytest-xdist
      - pytest-cov
