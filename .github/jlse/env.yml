# Conda environment for .gitlab-ci.yml (JLSE chiatta, Intel PVC).
# Nightly dpnp (dppy/label/dev) + dpctl 0.23.0 (conda-forge): the SYCL port needs
# dpctl >= 0.23 (dpctl.compiler). The nightly dpnp is only built for Python
# >= 3.13, and dpctl must not be forced onto the nightly channel (its rc builds
# do not solve against the 2026.2.0 toolchain).
# Same toolchain as sycl-cpu-ci-env.yml, minus the OpenCL CPU runtime.
# intel-compute-runtime supplies ocloc (AOT) and the level-zero loader comes
# from `level-zero`; the level-zero GPU driver itself is taken from the node
# (see ZE_DRIVER_DIR in ci_sycl.sh). No environment modules are used.
# Re-solved for every pipeline by ci_sycl.sh build (like the GitHub CPU CI) into a
# per-pipeline prefix under $CI_ROOT/envs; test jobs reuse the build job's env.
name: sycl-jlse
channels:
  - dppy/label/dev
  - https://software.repos.intel.com/python/conda
  - conda-forge
dependencies:
  - python=3.13
  - dppy/label/dev::dpnp>=0.21.0dev0
  - dpctl>=0.23.0
  - dpcpp_linux-64=2026.2.0
  - ifx_linux-64=2026.2.0
  - mkl-devel-dpcpp=2026.2.0
  - tbb-devel
  - intel-compute-runtime
  - intel-graphics-compiler
  - level-zero
  - cmake
  - ninja
  - ccache
  - numpy
  - scipy
  - h5py
  - pytest
  - pytest-timeout
  - pip
  - pip:
      - pyscf==2.14.0
      - basis-set-exchange==0.11
      - pyscf-dispersion==1.5.0
      - geometric==1.1.0
      - packaging~=24.0
      - MCFun
      - pytest-xdist
      - pytest-cov
