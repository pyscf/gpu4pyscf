name: SYCL CI (GitLab runner)

# Event-driven complement to the GitLab-side PR poller (.github/jlse/poll_prs.py,
# started by a scheduled pipeline on gitlab.jlse.anl.gov).
#
# When the GitLab project's trigger credentials are configured as secrets on
# this GitHub repo, every pull request immediately starts a SYCL CI pipeline on
# gitlab.jlse via the GitLab trigger API, passing PR_NUMBER / PR_SHA / PR_REPO.
# The .gitlab-ci.yml rules ($CI_PIPELINE_SOURCE =~ /^(trigger|pipeline)$/ &&
# $PR_NUMBER) then run the usual sycl-build + sycl-test jobs on the GitLab
# runner node, fetching the PR's merge ref from GitHub, and the report-* jobs
# publish the logs as a gist plus a "SYCL CI" commit status on the PR head --
# readable by anyone with the link, no GitLab account needed. The device
# running the job is printed at the top of the job logs (sycl-ls / dpctl).
#
# Security: the @sycl-jlse comment trigger is gated to PR comments by
# OWNER/MEMBER/COLLABORATOR authors, mirroring the poller's
# PR_ALLOWED_ASSOCIATIONS gate -- it must not let arbitrary accounts start
# runs that build untrusted PR code on JLSE.
#
# Pull requests from forks do not receive repo secrets, so the trigger step is
# skipped there and the job summary notes that the scheduled GitLab poller
# covers them instead (PR_REPO defaults to pyscf/gpu4pyscf). No GitHub-side
# credentials are needed for that path.
#
# Required GitHub secrets (optional):
#   JLSE_GITLAB_PROJECT        GitLab project ID or URL-encoded path on gitlab.jlse.anl.gov
#   JLSE_GITLAB_TRIGGER_TOKEN  project trigger token
# Optional GitHub variables:
#   JLSE_GITLAB_API            default https://gitlab.jlse.anl.gov/api/v4
#   JLSE_GITLAB_REF            trusted ref the pipeline checks out (default main)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run SYCL CI on (maintainers only)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  # key on the event name too, so a plain comment cannot cancel an in-flight
  # pull_request trigger run
  group: sycl-jlse-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  trigger:
    if: >-
      # workflow_dispatch (manual pr_number input) and same-repo PRs run the
      # trigger; fork PRs get no secrets and are covered by the GitLab poller,
      # so the job is skipped there (shows neutral, not a misleading green).
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@sycl-jlse') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # the secrets context is not allowed in step `if:`, so pass them via env
      JLSE_PROJECT: ${{ secrets.JLSE_GITLAB_PROJECT }}
      JLSE_TOKEN: ${{ secrets.JLSE_GITLAB_TRIGGER_TOKEN }}
      # fork pull_request runs get no secrets and a read-only GITHUB_TOKEN
      IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Resolve PR number, head SHA and base repo
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber, sha, baseRepo, ref;
            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              sha = context.payload.pull_request.head.sha;
              baseRepo = context.payload.pull_request.base.repo.full_name;
              ref = context.payload.pull_request.base.repo.default_branch;
            } else if (context.eventName === 'workflow_dispatch' ||
                       (context.payload.issue && context.payload.issue.pull_request)) {
              const num = context.eventName === 'workflow_dispatch'
                ? Number(context.payload.inputs.pr_number) : context.payload.issue.number;
              const pr = (await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: num})).data;
              prNumber = pr.number; sha = pr.head.sha; baseRepo = pr.base.repo.full_name;
              ref = pr.base.repo.default_branch;
            } else {
              core.setFailed('@sycl-jlse only works in pull request comments.');
              return;
            }
            core.setOutput('number', prNumber);
            core.setOutput('sha', sha);
            core.setOutput('repo', baseRepo);
            core.setOutput('ref', ref);

      - name: Trigger SYCL CI pipeline on gitlab.jlse
        id: trig
        if: ${{ steps.pr.outputs.number != '' && env.JLSE_PROJECT != '' && env.JLSE_TOKEN != '' }}
        env:
          API: ${{ vars.JLSE_GITLAB_API || 'https://gitlab.jlse.anl.gov/api/v4' }}
        run: |
          resp=$(curl -fsS -X POST "$API/projects/$JLSE_PROJECT/trigger/pipeline" \
            --data-urlencode "token=$JLSE_TOKEN" \
            --data-urlencode "ref=${{ steps.pr.outputs.ref || vars.JLSE_GITLAB_REF || 'main' }}" \
            --data-urlencode "variables[PR_NUMBER]=${{ steps.pr.outputs.number }}" \
            --data-urlencode "variables[PR_SHA]=${{ steps.pr.outputs.sha }}" \
            --data-urlencode "variables[PR_REPO]=${{ steps.pr.outputs.repo }}")
          echo "$resp"
          url=$(echo "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["web_url"])')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=SYCL CI (GitLab)::triggered for PR #${{ steps.pr.outputs.number }}: $url"
          echo "SYCL CI (GitLab): triggered for PR #${{ steps.pr.outputs.number }} -> $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Report skip (no JLSE secrets; GitLab poller covers this PR)
        if: ${{ steps.pr.outputs.number != '' && (env.JLSE_PROJECT == '' || env.JLSE_TOKEN == '') }}
        run: |
          if [ "$IS_FORK_PR" = "true" ]; then why="fork PR has no JLSE secrets"; else why="no JLSE trigger secrets configured on this repo"; fi
          msg="SYCL CI (GitLab): skipped here -- $why; the scheduled poller on gitlab.jlse runs PR #${{ steps.pr.outputs.number }} within ~10 min and posts the 'SYCL CI' commit status."
          echo "::notice title=SYCL CI (GitLab)::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        # fork PRs: read-only token, the step summary above is the report
        if: ${{ steps.pr.outputs.number != '' && env.IS_FORK_PR != 'true' }}
        continue-on-error: true   # e.g. Dependabot PRs also get a read-only token (403)
        uses: actions/github-script@v7
        with:
          script: |
            const n = Number('${{ steps.pr.outputs.number }}');
            const url = '${{ steps.trig.outputs.url }}';
            const body = url
              ? 'SYCL CI triggered: ' + url + '\n\n' +
                'When it finishes, the report stage posts the logs as a gist (link-shareable, ' +
                'not listed) and a `SYCL CI` commit status on this PR ' +
                '(see `.github/jlse/README.md`).'
              : 'SYCL CI (GitLab): this repo has no GitLab trigger secrets (fork PR?), so the ' +
                'scheduled GitLab PR poller picks this PR up within ~10 min instead ' +
                '(PR_REPO=${{ steps.pr.outputs.repo }}). Results are posted back as a gist ' +
                '(link-shareable) + commit status.';
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: n, body});
            } catch (e) {
              if (e.status === 403) {
                // fork PRs get a read-only GITHUB_TOKEN: the trigger step was
                // skipped, and the poller's pipeline report (status/gist) is
                // the reporting path there. Skip quietly.
                core.info('PR comment skipped (403, read-only token on a fork PR); the GitLab pipeline report stage posts the result instead.');
              } else { throw e; }
            }
