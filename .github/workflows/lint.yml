name: Lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install ruff
      run: pip install ruff==0.15
    - name: Check style
      run: ruff check --config .ruff.toml --unsafe-fixes gpu4pyscf
    - name: Check NumPy
      run: ruff check --select NPY --ignore NPY002 gpu4pyscf
