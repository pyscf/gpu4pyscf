# SYCL CI on JLSE GitLab (https://gitlab.jlse.anl.gov), running on chiatta
# (Intel Data Center GPU Max / PVC) nodes via the Jacamar `batch` runner.
# Counterpart of upstream's CUDA single-GPU job (.github/workflows/unittest.yml);
# the SYCL backend is single-GPU only for now, so there is no multi-GPU job.
#
# Pipelines:
#   - merge requests, pushes to the default branch, manual ("web") runs:
#       build + test of this checkout.
#   - pull requests of the upstream GitHub repo: a scheduled pipeline (POLL_PRS=true)
#       runs pr-poller on a login node every few minutes; for each new or updated PR
#       it starts a pipeline (PR_NUMBER set) that builds and tests that PR's merge
#       ref, then publishes the logs (see .github/jlse/README.md).
#
# build : builds the SYCL backend (PVC AOT) and publishes the tree to the shared
#         filesystem, keyed by pipeline id (single tile, ZE_AFFINITY_MASK=0).
# test  : the scf + df suites (gpu4pyscf/scf gpu4pyscf/df) by default, sharded
#         over all GPU tiles of the chiatta node -- one single-device pytest
#         process per tile (ZE_AFFINITY_MASK=<tile>, numactl-bound to the tile's
#         NUMA node).
#
# CI/CD variables (Settings > CI/CD > Variables): SYCL_TESTS, SYCL_ARCHITECTURES, CI_ROOT,
# ZE_DRIVER_DIR, PYTEST_WORKERS; SYCL_TILES (default: all visible GPU tiles), SYCL_TILE_WORKERS,
# SYCL_TILE_OMP; USE_MODULES (default 1: toolchain from system modules), SYCL_MODULES,
# SYCL_MODULE_PATH, SYCL_CI_ENV_FILE; PR_REPO, PR_ALLOWED_ASSOCIATIONS, PR_MAX_TRIGGERS,
# GITLAB_TRIGGER_TOKEN, GITHUB_GIST_TOKEN, GITHUB_STATUS_TOKEN, GITHUB_READ_TOKEN.
# See .github/jlse/ci_sycl.sh, poll_prs.py and report_pr.py.

include:
  - project: 'ci-resources/defaults'
    ref: main
    file:
      - '/runners.yml'

stages:
  - poll
  - build
  - test
  - report

# ci-resources/defaults has no chiatta runner yet, so define it here from the
# same pieces its other runners use (id token, batch tag, ALCF proxy).
.chiatta-runner:
  extends: .batch-runner
  # If a PR pipeline is cancelled/superseded, report_pr.py posts an "error"
  # status so the SYCL CI check on the PR does not stay pending forever.
  after_script:
    - '[ "$CI_JOB_STATUS" = canceled ] && [ -n "${PR_NUMBER:-}" ] && python3 .github/jlse/report_pr.py canceled || true'
  variables:
    # --jobname shows up in qstat, e.g. gpu4pyscf-sycl-build-p42.
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 120 -q chiatta --jobname gpu4pyscf-$CI_JOB_NAME-p$CI_PIPELINE_IID"
    # See every PVC tile as a level_zero:gpu device from the start (ci_sycl.sh
    # also defaults to this; set explicitly so it applies before anything runs).
    # With ZE_FLAT_DEVICE_HIERARCHY=FLAT (set in ci_sycl.sh) the node's 8 cards
    # show up as 16 GPU devices; the test job shards tests over all of them,
    # one single-device process per tile (ZE_AFFINITY_MASK).
    ONEAPI_DEVICE_SELECTOR: "level_zero:gpu"
    HTTP_PROXY: "http://proxy.ftm.alcf.anl.gov:3128"
    HTTPS_PROXY: "http://proxy.ftm.alcf.anl.gov:3128"
    http_proxy: "http://proxy.ftm.alcf.anl.gov:3128"
    https_proxy: "http://proxy.ftm.alcf.anl.gov:3128"
    NO_PROXY: "localhost,127.0.0.1,.anl.gov"
    GIT_DEPTH: "1"

# Merge requests, default-branch pushes, manual runs, and PR pipelines started by
# pr-poller. The polling schedule itself builds nothing.
.sycl-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $POLL_PRS == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(trigger|pipeline)$/ && $PR_NUMBER'

.pr-only-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(trigger|pipeline)$/ && $PR_NUMBER'
    # manual smoke test: Run pipeline (web) with PR_NUMBER/PR_SHA/PR_REPO set
    - if: '$CI_PIPELINE_SOURCE == "web" && $PR_NUMBER'

pr-poller:
  stage: poll
  extends: .shell-runner
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $POLL_PRS == "true"'
  variables:
    GIT_STRATEGY: fetch
  script:
    - python3 .github/jlse/poll_prs.py

sycl-build:
  stage: build
  extends: [.chiatta-runner, .sycl-rules]
  timeout: 2h
  interruptible: true
  script:
    - .github/jlse/ci_sycl.sh build
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - ci-logs/

sycl-test:
  stage: test
  extends: [.chiatta-runner, .sycl-rules]
  needs: [sycl-build]
  timeout: 2h
  interruptible: true
  variables:
    # scf + df suites run by default, sharded over all GPU tiles (much faster than
    # one tile). To run other/different suites, set SYCL_TESTS (space-separated
    # pytest paths) when starting a pipeline manually:
    # Build > Pipelines > New pipeline > Variables.
    # Test selection matches the upstream single-GPU CUDA CI exactly
    # (unittest.yml): -m 'not slow and not benchmark and not special'
    # -k 'not _high_cost' -- long/expensive tests are skipped the same way.
    SYCL_TESTS: "gpu4pyscf/scf gpu4pyscf/df"
  script:
    - .github/jlse/ci_sycl.sh test $SYCL_TESTS
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - ci-logs/

# Publish the result of PR pipelines where contributors can read it without a
# GitLab account (a gist, plus a commit status on the PR when a token is set).
.report:
  stage: report
  extends: [.shell-runner, .pr-only-rules]
  needs:
    - job: sycl-build
      optional: true
      artifacts: true
    - job: sycl-test
      optional: true
      artifacts: true

report-success:
  extends: .report
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(trigger|pipeline)$/ && $PR_NUMBER'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" && $PR_NUMBER'
      when: on_success
  script:
    - python3 .github/jlse/report_pr.py success

report-failure:
  extends: .report
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(trigger|pipeline)$/ && $PR_NUMBER'
      when: on_failure
    - if: '$CI_PIPELINE_SOURCE == "web" && $PR_NUMBER'
      when: on_failure
  script:
    - python3 .github/jlse/report_pr.py failure
