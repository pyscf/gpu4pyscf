# SYCL CI on JLSE GitLab (https://gitlab.jlse.anl.gov), running on chiatta
# (Intel Data Center GPU Max / PVC) nodes via the Jacamar `batch` runner.
# Counterpart of upstream's CUDA single-GPU job (.github/workflows/unittest.yml);
# the SYCL backend is single-GPU only for now, so there is no multi-GPU job.
#
# build : builds the SYCL backend (PVC AOT) and publishes the tree to the shared
#         filesystem, keyed by commit SHA.
# test  : the test suite split into suites that run in parallel, one chiatta
#         node each (the queue allows 8 queued jobs per user and 2 h per job).
#
# Optional CI/CD variables (Settings > CI/CD > Variables): SYCL_AOT, CI_ROOT,
# ZE_DRIVER_DIR, PYTEST_WORKERS. See .github/jlse/ci_sycl.sh.

include:
  - project: 'ci-resources/defaults'
    ref: main
    file:
      - '/runners.yml'

stages:
  - build
  - test

# ci-resources/defaults has no chiatta runner yet, so define it here from the
# same pieces its other runners use (id token, batch tag, ALCF proxy).
.chiatta-runner:
  extends: .batch-runner
  variables:
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 120 -q chiatta"
    HTTP_PROXY: "http://proxy.ftm.alcf.anl.gov:3128"
    HTTPS_PROXY: "http://proxy.ftm.alcf.anl.gov:3128"
    http_proxy: "http://proxy.ftm.alcf.anl.gov:3128"
    https_proxy: "http://proxy.ftm.alcf.anl.gov:3128"
    NO_PROXY: "localhost,127.0.0.1,.anl.gov"
    GIT_DEPTH: "1"

# Every merge request, pushes to the default branch, manual and scheduled runs.
.sycl-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'

sycl-build:
  stage: build
  extends: [.chiatta-runner, .sycl-rules]
  timeout: 2h
  interruptible: true
  script:
    - .github/jlse/ci_sycl.sh build
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - ci-logs/*.log

sycl-test:
  stage: test
  extends: [.chiatta-runner, .sycl-rules]
  needs: [sycl-build]
  timeout: 2h
  interruptible: true
  parallel:
    matrix:
      # Suite groupings are a first guess; rebalance once per-suite timings are known.
      - SUITE: "core"
        PATHS: "gpu4pyscf/scf gpu4pyscf/tests gpu4pyscf/lib gpu4pyscf/gto gpu4pyscf/x2c gpu4pyscf/pop"
      - SUITE: "dft"
        PATHS: "gpu4pyscf/dft"
      - SUITE: "df-solvent"
        PATHS: "gpu4pyscf/df gpu4pyscf/solvent gpu4pyscf/qmmm"
      - SUITE: "grad-hessian"
        PATHS: "gpu4pyscf/grad gpu4pyscf/hessian"
      - SUITE: "excited"
        PATHS: "gpu4pyscf/tdscf gpu4pyscf/nac gpu4pyscf/properties"
      - SUITE: "pbc"
        PATHS: "gpu4pyscf/pbc"
      - SUITE: "post-hf"
        PATHS: "gpu4pyscf/cc gpu4pyscf/mp gpu4pyscf/mcscf gpu4pyscf/fci gpu4pyscf/sem gpu4pyscf/md gpu4pyscf/geomopt gpu4pyscf/dispersion"
  script:
    - .github/jlse/ci_sycl.sh test $PATHS
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - ci-logs/*.log
